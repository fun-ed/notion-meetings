<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
<style>
  :root { color-scheme:light; --bg:#fff; --fg:#37352f; --muted:#787774; --faint:#9b9a97; --line:#e9e9e7; --side:#f7f7f5; --hover:#efefed;
    --accent:#2383e2; --red:#eb5757; --input:#fff; --side-link:#5f5e5b; --placeholder:#e1e1df; --code-bg:#f2f1ee; --mark:#fdecc8;
    --hl:#fbf3db; --active-bg:#eef5fc; --active-ring:#c7dff5; --uncertain:#fde2dd;
    --t-gray:#e3e2e0; --t-blue:#d3e5ef; --t-green:#dbeddb; --t-orange:#fadec9; --t-yellow:#fdecc8; --t-red:#ffe2dd; --t-purple:#e8deee; }
  /* Dark palette follows Notion's dark mode */
  [data-theme=dark] { color-scheme:dark; --bg:#191919; --fg:#d4d4d4; --muted:#9b9b9b; --faint:#7d7d7d; --line:#2f2f2f; --side:#202020; --hover:#2c2c2c;
    --accent:#3b8fe0; --red:#e06c63; --input:#252525; --side-link:#a5a5a5; --placeholder:#4a4a4a; --code-bg:#2c2c2c; --mark:#5c4b1e;
    --hl:#3f3a28; --active-bg:#1d2b3a; --active-ring:#2b4c74; --uncertain:#5c2b28;
    --t-gray:#373737; --t-blue:#1d3a50; --t-green:#203a2c; --t-orange:#4a3020; --t-yellow:#4a3d1a; --t-red:#4d2623; --t-purple:#372c47; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; color:var(--fg); background:var(--bg);
    /* Pin the app shell to the viewport edges instead of trusting 100vh, which some browsers size short. */
    position:fixed; inset:0; display:grid; grid-template-columns:var(--side-w, 240px) minmax(0, 1fr); grid-template-rows:minmax(0, 1fr); }
  body.side-collapsed { grid-template-columns:0 minmax(0, 1fr); } body.side-collapsed aside { visibility:hidden; }
  body.anon { grid-template-columns:minmax(0, 1fr); } body.anon aside, body.anon #resizer, body.anon #side-open { display:none; }
  #resizer { position:fixed; top:0; bottom:0; left:calc(var(--side-w, 240px) - 3px); width:6px; cursor:col-resize; z-index:20; }
  #resizer:hover, body.resizing #resizer { background:var(--accent); opacity:.35; }
  body.resizing { cursor:col-resize; user-select:none; }
  body.side-collapsed #resizer { display:none; }
  .side-btn { border:0; background:none; color:var(--muted); padding:0 6px; font-size:16px; line-height:1; }
  #side-open { position:fixed; top:10px; left:10px; z-index:20; display:none; background:var(--side); border:1px solid var(--line); border-radius:6px; padding:2px 8px; }
  body.side-collapsed #side-open { display:block; }
  input, textarea, select { background:var(--input); }
  a { color:inherit; }
  input[type=checkbox], input[type=radio] { accent-color:var(--accent); }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { border:1px solid var(--line); background:var(--input); border-radius:6px; padding:3px 10px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--hover); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#0b6ec5; }
  button.rec { background:var(--red); border-color:var(--red); color:#fff; }
  button.ghost { border-color:transparent; color:var(--muted); }
  select { border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .muted { color:var(--muted); font-size:14px; }
  .err { color:var(--red); }
  .spacer { flex:1; }

  /* Sidebar */
  aside { background:var(--side); border-right:1px solid var(--line); overflow:auto; padding:10px 6px; font-size:14px; display:flex; flex-direction:column; }
  aside > * { flex-shrink:0; }
  aside .ws { font-weight:600; padding:6px 4px 10px 10px; display:flex; align-items:center; }
  aside .ws .side-btn { margin-left:auto; }
  aside a { display:flex; gap:8px; align-items:center; padding:3px 10px; border-radius:6px; text-decoration:none; color:var(--side-link); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  aside a:hover, aside a.on { background:var(--hover); color:var(--fg); }
  aside a.on { font-weight:600; }
  aside .side-h { color:var(--faint); font-size:12px; padding:14px 10px 4px; }

  /* Page */
  main { overflow:auto; }
  .page { max-width:900px; margin:0 auto; padding:24px 96px 120px; }
  .page.wide { max-width:1200px; }
  .crumb { font-size:14px; color:var(--muted); margin-bottom:28px; }
  .crumb a { text-decoration:none; }
  .crumb a:hover { text-decoration:underline; }
  .icon { font-size:64px; line-height:1; margin:8px 0 6px; }
  h1 { font-size:40px; font-weight:700; line-height:1.2; margin:0 0 8px; }
  h1 input { font:inherit; border:0; outline:none; width:100%; padding:0; background:transparent; }
  h1 input::placeholder { color:var(--placeholder); }
  h2.h2 { font-size:22px; font-weight:600; margin:32px 0 6px; }

  /* Properties */
  .props { margin:8px 0 20px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .prop { display:grid; grid-template-columns:160px minmax(0, 1fr); align-items:start; min-height:34px; }
  .prop > span:first-child { color:var(--muted); font-size:14px; padding:6px 6px 6px 0; }
  .prop > div { padding:5px 6px; border-radius:4px; font-size:14px; }
  .prop > div:hover { background:var(--hover); }
  .prop textarea { width:100%; border:0; background:transparent; resize:vertical; outline:none; padding:0; font-size:14px; min-height:22px; }
  .prop select { border:0; background:transparent; padding:0; }
  .prop input:not([type=checkbox]) { border:0; background:transparent; outline:none; padding:0; width:100%; font-size:14px; }
  .prop .tag-add { width:140px; display:inline-block; }
  .tag-x { border:0; background:none; padding:0 8px 0 0; margin-left:-4px; color:var(--muted); line-height:1; }
  a.tag { text-decoration:none; }
  .kbd { margin-left:auto; color:var(--faint); font-size:12px; }
  input.search { width:100%; font-size:18px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; outline:none; margin:8px 0 6px; }
  input.search:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--active-ring); }
  code { background:var(--code-bg); color:#eb5757; border-radius:3px; padding:0 4px; font-size:13px; }
  .result { padding:12px 0; border-bottom:1px solid var(--line); }
  .result .r-title { font-weight:600; font-size:16px; text-decoration:none; }
  .hit { display:block; text-decoration:none; padding:3px 8px; margin:4px 0 0; border-radius:4px; font-size:14px; }
  .hit:hover { background:var(--side); }
  .hit-label { color:var(--muted); font-size:12px; margin-right:6px; }
  mark { background:var(--mark); color:inherit; border-radius:2px; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0 4px; }
  input.search.small { font-size:14px; padding:4px 10px; width:280px; margin:0; }
  details.group { border-bottom:1px solid var(--line); }
  details.group > summary { cursor:pointer; list-style:none; display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 4px; border-radius:4px; }
  details.group > summary::-webkit-details-marker { display:none; }
  details.group > summary::before { content:'▸'; color:var(--muted); transition:transform .15s; }
  details.group[open] > summary::before { transform:rotate(90deg); }
  details.group > summary:hover { background:var(--side); }
  details.group > summary a { text-decoration:none; font-weight:600; }
  details.group > summary a.tag { font-weight:400; }
  details.group .count { margin-left:auto; color:var(--muted); font-size:13px; background:var(--hover); border-radius:10px; padding:0 8px; }
  details.group table.db { margin:0 0 10px 18px; width:calc(100% - 18px); }
  td.chk { width:36px; }
  td.done { text-decoration:line-through; color:var(--faint); }
  textarea.csv { width:100%; font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; border:1px solid var(--line); border-radius:6px; padding:8px; }

  /* Tags: Notion option colors */
  .tag { display:inline-block; padding:0 6px; border-radius:3px; font-size:13px; line-height:20px; margin:1px 4px 1px 0; white-space:nowrap; }
  .gray { background:var(--t-gray); } .blue { background:var(--t-blue); } .green { background:var(--t-green); }
  .orange { background:var(--t-orange); } .yellow { background:var(--t-yellow); } .red { background:var(--t-red); } .purple { background:var(--t-purple); }

  /* Database views */
  .views { display:flex; gap:4px; align-items:center; border-bottom:1px solid var(--line); margin:18px 0 0; }
  .views .view { border:0; border-radius:0; background:none; padding:6px 8px; color:var(--muted); font-size:14px; border-bottom:2px solid transparent; }
  .views .view.on { color:var(--fg); border-bottom-color:var(--fg); }
  table.db { width:100%; border-collapse:collapse; font-size:14px; }
  table.db th { text-align:left; font-weight:400; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.db td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.db th + th, table.db td + td { border-left:1px solid var(--line); }
  table.db tbody tr { cursor:pointer; }
  table.db tbody tr:hover { background:var(--side); }
  table.db td.name { font-weight:500; }
  table.db td.nowrap { white-space:nowrap; }
  .db-foot { padding:6px 8px; color:var(--faint); font-size:14px; }
  .db-foot a { text-decoration:none; }

  /* AI meeting notes block */
  .ai-block { border:1px solid var(--line); border-radius:10px; padding:12px 16px 14px; box-shadow:0 1px 2px rgba(15,15,15,.04); }
  .ai-head { display:flex; gap:10px; align-items:center; font-weight:600; }
  .ai-head .muted { font-weight:400; }
  .tabs { display:flex; gap:2px; margin:10px 0 8px; }
  .tabs .tab { border:0; background:none; color:var(--muted); padding:3px 10px; border-radius:6px; }
  .tabs .tab.on { background:var(--hover); color:var(--fg); font-weight:600; }
  .ai-foot { display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
  .ai-foot details { width:100%; }
  .ai-foot textarea, .notes { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-height:70px; }
  .notes { border:0; outline:none; min-height:160px; padding:4px 0; resize:vertical; }
  .ai-start { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
  #live { background:var(--side); border-radius:6px; padding:10px 12px; min-height:60px; white-space:pre-wrap; font-size:14px; }
  #live i { color:var(--muted); }
  audio { width:100%; height:36px; margin:8px 0 0; }

  .summary h3 { font-size:17px; font-weight:600; margin:16px 0 4px; }
  .summary ul { margin:2px 0; padding-left:24px; }
  .summary p { margin:4px 0; }
  a.cite { font-size:11px; vertical-align:super; text-decoration:none; color:var(--accent); }
  .todo { display:flex; gap:8px; align-items:baseline; padding:2px 0; cursor:pointer; }
  .todo input { margin:0; transform:translateY(1px); }
  .todo.done > span:first-of-type { text-decoration:line-through; color:var(--faint); }

  .speakers { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .speakers label { font-size:13px; }
  .speakers input { width:110px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  .seg { display:grid; grid-template-columns:52px 96px 1fr; gap:8px; padding:4px 6px; border-radius:4px; font-size:15px;
    border-left:3px solid transparent; transition:background-color .3s, border-color .3s, box-shadow .3s; }
  .seg.active { border-left-color:var(--accent); background:var(--active-bg); box-shadow:0 0 0 1px var(--active-ring); animation:seg-glow .7s ease-out; }
  @keyframes seg-glow { from { box-shadow:0 0 0 5px rgba(35,131,226,.35); } to { box-shadow:0 0 0 1px var(--active-ring); } }
  .player { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .player button { font-size:13px; padding:1px 8px; }
  .player .rate.on { background:var(--fg); border-color:var(--fg); color:var(--bg); }
  .seg.hl { background:var(--hl); }
  .seg time { color:var(--accent); cursor:pointer; font-variant-numeric:tabular-nums; }
  .seg b { font-weight:600; }
  .seg b.pick { cursor:pointer; } .seg b.pick:hover { text-decoration:underline dotted; }
  .seg select { font-size:13px; max-width:96px; }
  .speakers select { font-size:12px; margin-left:4px; }
  .seg mark { background:var(--uncertain); }
  .notes { background:transparent; }
  .auth-box { max-width:380px; margin:12vh auto 0; }
  .auth-box label { display:block; margin:10px 0; font-size:14px; color:var(--muted); }
  .auth-box input { display:block; width:100%; margin-top:4px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; color:var(--fg); }
  .who { padding:6px 10px; font-size:13px; }
  /* Version and repo, pinned to the bottom of the sidebar */
  #ver { margin-top:auto; padding:12px 10px 4px; font-size:12px; color:var(--faint); line-height:1.6; }
  #ver a { display:block; padding:0; color:inherit; } #ver a:hover { background:none; color:var(--fg); } #ver a.tag { display:inline-block; padding:0 6px; }
  .range-pick { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:2px 0 6px 60px; padding:6px 8px; font-size:13px; background:var(--hover); border-radius:6px; }
  .range-pick input { width:56px; } .seg.in-range { background:var(--hl); }
  .hints { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0 8px; font-size:13px; }
  .learn-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; font-size:13px; }
  .learn-row input { border:1px solid var(--line); border-radius:6px; padding:1px 6px; min-width:220px; }
  .comment { padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .comment > div { white-space:pre-wrap; margin-top:2px; }
  #cmt { width:100%; min-height:60px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-top:8px; }
  .notice { background:var(--hl); border-radius:6px; padding:8px 12px; margin:8px 0; font-size:14px; }
  .share-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; padding:4px 0; }
  tr[data-model] input:not([type=checkbox]):not([type=radio]), tr[data-model] select, tr[data-model] textarea { width:100%; min-width:70px; border:1px solid var(--line); border-radius:4px; padding:1px 4px; font-size:13px; }
  details[data-agent] .props textarea, details[data-agent] .props input { border:1px solid var(--line); border-radius:4px; padding:2px 6px; }
  .scroll-x { overflow-x:auto; } table.usage th, table.usage td { white-space:nowrap; }
  table.usage { font-size:12px; margin:4px 0 8px; } table.usage tbody tr { cursor:default; }
  table.usage tr.err td { color:var(--red); }
  .share-row input { flex:1; min-width:280px; border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:12px; }
</style>
</head>
<body>
<aside>
  <div class="ws">🎙️ 會議工作區<button class="side-btn" onclick="toggleSide(true)" title="收合側欄（⌘\）" aria-label="收合側欄">«</button></div>
  <a href="#new" data-r="new" id="nav-new">＋ 新會議</a>
  <a href="#" data-r="db">📅 會議紀錄</a>
  <a href="#search" data-r="search">🔍 搜尋<span class="kbd">⌘K</span></a>
  <a href="#actions" data-r="actions">✅ Action Items</a>
  <a href="#people" data-r="people">👥 成員與團隊</a>
  <div class="side-h">最近的會議</div>
  <nav id="list"></nav>
  <div class="side-h">帳號</div>
  <div id="who"></div>
  <div id="ver"></div>
</aside>
<div id="resizer" title="拖曳調整寬度，雙擊恢復預設" aria-hidden="true"></div>
<button id="side-open" onclick="toggleSide(false)" title="展開側欄（⌘\）" aria-label="展開側欄">»</button>
<main id="main"></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const fmt = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
// Every date and time shows Taiwan time (GMT+8), whatever the browser's time zone.
const TZ = 'Asia/Taipei';
const day = iso => new Date(iso).toLocaleDateString('zh-TW', { timeZone: TZ, year: 'numeric', month: 'long', day: 'numeric' });
const dt = iso => new Date(iso).toLocaleString('zh-TW', { timeZone: TZ, hour12: false });
const spk = (m, s) => m.speakers?.[s] || `Speaker ${s < 26 ? String.fromCharCode(65 + s) : s + 1}`;
const COLORS = ['#2383e2', '#d9730d', '#0f7b6c', '#9065b0', '#c14c8a', '#64473a'];
const TYPES = { auto: ['自動', 'gray'], team: ['團隊會議', 'blue'], standup: ['站立會議', 'green'], sales: ['業務會議', 'orange'] };
const STATUS = { transcribing: ['轉錄中', 'yellow'], correcting: ['校對術語中', 'yellow'], summarizing: ['產生摘要中', 'yellow'], done: ['完成', 'green'], error: ['失敗', 'red'] };
const BUSY = ['transcribing', 'correcting', 'summarizing'];
const LANGS = [['zh-TW', '中文（台灣，含中英夾雜）'], ['auto', '自動偵測'], ['zh-CN', '中文（簡體）'], ['en', 'English'], ['ja', '日本語'], ['ko', '한국어'],
  ['es', 'Español'], ['fr', 'Français'], ['de', 'Deutsch'], ['pt', 'Português'], ['ru', 'Русский'], ['th', 'ไทย'], ['vi', 'Tiếng Việt'],
  ['nl', 'Nederlands'], ['sv', 'Svenska'], ['da', 'Dansk'], ['fi', 'Suomi'], ['no', 'Norsk']];
const tag = ([text, color]) => `<span class="tag ${color}">${esc(text)}</span>`;
const TAG_COLORS = ['blue', 'green', 'orange', 'purple', 'yellow', 'red', 'gray'];
const tagColor = t => TAG_COLORS[[...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % TAG_COLORS.length];
// Tags, teams and leaders link to a filtered search, like clicking a multi-select option in Notion.
const qLink = (op, v, color, prefix = '') => `<a class="tag ${color}" href="#search=${encodeURIComponent(`${op}:${/\s/.test(v) ? `"${v}"` : v}`)}" onclick="event.stopPropagation()">${prefix}${esc(v)}</a>`;
const tagLink = t => qLink('tag', t, tagColor(t));
const teamLink = t => qLink('team', t, tagColor(t), '🏢 ');
const leaderLink = l => qLink('leader', l, 'gray', '👔 ');
const localInput = iso => new Date(iso).toLocaleString('sv', { timeZone: TZ }).replace(' ', 'T').slice(0, 16);
const whenLabel = m => m.scheduledAt ? m.scheduledAt.replace('T', ' ').replaceAll('-', '/') : day(m.createdAt);
const allTags = () => [...new Set(meetings.flatMap(m => m.tags))].sort();
const num = n => Math.round(n ?? 0).toLocaleString();
const secs = ms => `${((ms ?? 0) / 1000).toFixed(1)} 秒`;
const KIND = { transcribe: '轉錄', correct: '術語校對', summary: '摘要', speakers: '講者建議', test: '連線測試' };
const usd = n => n ? `$${n.toFixed(4)}` : '';
// Anthropic's input_tokens excludes cached input; the real prompt size is input + cache read + cache write.
const inTotal = e => (e.inputTokens ?? 0) + (e.cacheReadTokens ?? 0) + (e.cacheWriteTokens ?? 0);
// Per-call AI usage table (meeting page and admin share the column layout).
const usageRows = rows => `<div class="scroll-x"><table class="db usage"><thead><tr><th>時間</th><th>項目</th><th>模型</th><th>effort</th><th>總輸入</th><th>輸出</th><th>其中快取讀／寫</th><th>音訊</th><th>費用</th><th>耗時</th></tr></thead><tbody>
  ${rows.map(e => `<tr${e.error ? ' class="err"' : ''}><td class="nowrap">${dt(e.at)}</td><td>${KIND[e.kind] ?? esc(e.kind)}${e.error ? ` ⚠ ${esc(e.error)}` : ''}</td>
    <td>${esc(e.label ?? e.model)}</td><td>${esc(e.effort ?? '')}</td><td>${e.provider !== 'openrouter' ? num(inTotal(e)) : ''}</td><td>${e.provider !== 'openrouter' ? num(e.outputTokens) : ''}</td>
    <td>${e.provider !== 'openrouter' ? `${num(e.cacheReadTokens)}／${num(e.cacheWriteTokens)}` : ''}</td><td>${e.audioSeconds ? fmt(e.audioSeconds) : ''}</td><td>${usd(e.costUsd)}</td><td class="nowrap">${secs(e.ms)}</td></tr>`).join('')}</tbody></table></div>`;
const totalOf = rows => ({ calls: rows.length,
  ...Object.fromEntries(['inputTokens', 'cacheReadTokens', 'cacheWriteTokens', 'outputTokens', 'ms', 'audioSeconds', 'costUsd'].map(f => [f, rows.reduce((a, e) => a + (e[f] ?? 0), 0)])) });
const usageLine = t => `${t.calls} 次 · 輸入 ${num(inTotal(t))}／輸出 ${num(t.outputTokens)} tokens · 耗時 ${secs(t.ms)}`

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const body = await res.json();
  // Expired or missing session: back to the login screen (the auth endpoints report their own errors).
  if (res.status === 401 && !path.startsWith('/api/auth/')) { me = null; showLogin('login'); }
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

async function submitAuth(e, mode) {

// Once per session, ask GitHub for the latest release; the sidebar shows it when it is newer than this server.
let latest = null, latestChecked = false;
const newerThan = (v, cur) => { const a = v.split('.').map(Number), b = cur.split('.').map(Number), i = a.findIndex((x, k) => x !== (b[k] ?? 0)); return i >= 0 && a[i] > (b[i] ?? 0); };
async function checkLatest() {
  // An older server (UI reloaded before the server restarted) sends no app info: skip instead of breaking login.
  if (latestChecked || !authInfo.app?.repo?.startsWith('https://github.com/')) return;
  latestChecked = true;
  try {
    const r = await (await fetch(`https://api.github.com/repos/${authInfo.app.repo.slice(19)}/releases/latest`)).json();
    const v = String(r.tag_name ?? '').replace(/^v/, '');
    if (/^\d+(\.\d+)*$/.test(v) && newerThan(v, authInfo.app.version)) { latest = { v, url: r.html_url }; renderWho(); }
  } catch {} // offline or rate-limited: keep the plain link
}

function collectAI() {
  const val = el => el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.type === 'number' ? +el.value : el.value;
  const read = (sel, base) => [...document.querySelectorAll(sel)].map(row => {
    const o = { ...base[+row.dataset.i] };
    row.querySelectorAll('[data-f]').forEach(el => { o[el.dataset.f] = val(el); });
    return o;
  });
  const uses = Object.fromEntries([...document.querySelectorAll('[data-use]')].map(el => [el.dataset.use, el.value]));
  return { models: read('[data-model]', aiCfg.models), agents: read('[data-agent]', aiCfg.agents), uses };
}

const datalists = () => `<datalist id="dl-people">${directory.people.map(p => `<option value="${esc(p.name)}">${esc(p.team)}</option>`).join('')}</datalist>

const canonKey = v => String(v).normalize('NFKC').replace(/\s+/g, '').toLowerCase();
const canon = (v, known) => { const t = String(v ?? '').trim().replace(/\s+/g, ' '); return known.find(k => canonKey(k) === canonKey(t)) ?? t; };
const canonList = (text, known) => String(text).split(/[,，、]/).map(x => canon(x, known)).filter(Boolean);

const actRows = (rows, showMeeting) => `<table class="db"><tbody>${rows.map(({ m, a, i }) => `<tr>
  <td class="chk"><input type="checkbox" aria-label="完成：${esc(a.text)}" ${a.done ? 'checked' : ''} ${rank(m.perm) < rank('edit') ? 'disabled title="沒有編輯權限"' : ''} onchange="setDone('${m.id}', ${i}, this.checked)"></td>
  <td class="name${a.done ? ' done' : ''}">${esc(a.text)}${a.cite ? ` <a class="cite" href="#${m.id}:seg-${a.cite}">[${a.cite}]</a>` : ''}</td>
  <td>${tag([a.owner || '未指定', 'purple'])}${a.team ? teamLink(a.team) : ''}${a.leader ? leaderLink(a.leader) : ''}</td>
  ${showMeeting ? `<td><a href="#${m.id}">📄 ${esc(m.title)}</a> <span class="muted nowrap">${esc(whenLabel(m))}</span></td>` : ''}</tr>`).join('')}</tbody></table>`;

function renderActions() {
  const q = act.q.trim().toLowerCase();
  const rows = meetings.flatMap(m => m.actions.map((a, i) => ({ m, a, i }))).filter(({ m, a }) =>
    (act.status === 'all' || (act.status === 'done') === a.done) && (!act.tag || m.tags.includes(act.tag))
    && (!act.team || a.team === act.team) && (!act.leader || a.leader === act.leader)
    && (!q || [a.text, a.owner, a.team, a.leader, m.title, ...m.tags].join(' ').toLowerCase().includes(q)));
  const key = ({ m, a }) => ({ meeting: m.id, team: a.team || '（未對應團隊）', owner: a.owner || '未指定', leader: a.leader || '（沒有 Y leader）' })[act.group];
  const groups = new Map();
  for (const r of rows) groups.set(key(r), [...(groups.get(key(r)) ?? []), r]);
  const label = (k, [{ m }]) => act.group === 'meeting'
    ? `📄 <a href="#${m.id}">${esc(m.title)}</a> <span class="muted">${esc(whenLabel(m))}</span>${m.tags.map(tagLink).join('')}${m.teams.map(teamLink).join('')}
       <span class="muted">· 完成 ${m.actions.filter(a => a.done).length} / ${m.actions.length}</span>`
    : act.group === 'team' && !k.startsWith('（') ? teamLink(k) : act.group === 'leader' && !k.startsWith('（') ? `👔 ${leaderLink(k)}` : esc(k);
  // Filtering is a search: open every group so matches are visible.
  const autoOpen = q || act.tag || act.team || act.leader;
  $('#act-list').innerHTML = !rows.length ? '<p class="muted">沒有符合的待辦事項</p>'
    : act.group === 'none' ? actRows(rows, true)
    : [...groups].map(([k, rs]) => `<details class="group" data-k="${esc(act.group + k)}" ${autoOpen || openGroups.has(act.group + k) ? 'open' : ''} ontoggle="toggleGroup(this)">
        <summary>${label(k, rs)} <span class="count">${rs.length}</span></summary>${actRows(rs, act.group !== 'meeting')}</details>`).join('');
  $('#act-list').insertAdjacentHTML('beforeend', `<div class="db-foot">共 ${rows.length} 筆，${groups.size} 組</div>`);
}

function toggleGroup(el) { openGroups[el.open ? 'add' : 'delete'](el.dataset.k); }
function toggleAll(open) { document.querySelectorAll('#act-list details').forEach(d => { d.open = open; }); }

async function setDone(id, i, done) {
  const m = current?.id === id ? current : meetings.find(x => x.id === id);
  const updated = await api(`/api/meetings/${id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ actions: m.actions.map((a, k) => k === i ? { ...a, done } : a) }),
  });
  if (current?.id === id) { current = updated; render(current); refreshList(); }
  else if ($('#act-list')) { await refreshList(); renderActions(); }
}

async function upload(blob, filename) {
  $('#msg').textContent = '上傳中…';
  const q = new URLSearchParams({ filename, lang: $('#lang').value, title: $('#title').value || filename, glossary: $('#glossary').value,
    scheduledAt: $('#when').value, location: $('#location').value, brief: $('#brief').value, tags: canonList($('#tags').value, allTags()), agentId: $('#agent').value });
  try {
    const m = await api(`/api/meetings?${q}`, { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
    location.hash = m.id;
  } catch (e) {
    $('#msg').innerHTML = `<span class="err">上傳失敗：${esc(e.message)}</span>`;
  }
}

function uploadFile() {
  const f = $('#file').files[0];
  if (f) upload(f, f.name);
}

// ---- 錄音 + 即時字幕 ----
let rec, recog, recStart, tick;
async function toggleRec() {
  if (rec?.state === 'recording') return rec.stop();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return $('#msg').innerHTML = `<span class="err">無法使用麥克風：${esc(e.message)}</span>`; }
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    recog?.stop(); recog = null; clearInterval(tick);
    $('#recBtn').textContent = '● 開始轉錄'; $('#recBtn').classList.replace('rec', 'primary');
    const type = rec.mimeType || 'audio/webm';
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    upload(new Blob(chunks, { type }), `recording-${new Date().toISOString().replace(/[:.]/g, '-')}.${ext}`);
  };
  // shortcut: chunks live only in memory until stop; a tab crash loses the recording. Upload chunks incrementally if meetings run long.
  rec.start(1000);
  recStart = Date.now();
  tick = setInterval(() => $('#recTime').textContent = fmt((Date.now() - recStart) / 1000), 500);
  $('#recBtn').textContent = '■ 停止並產生筆記'; $('#recBtn').classList.replace('primary', 'rec');
  startCaptions();
}

// Live captions are opt-in and on-device only (D-019): Chrome's default recognition sends audio to a cloud
// service, which the ZDR boundary (D-008) rules out. Never fall back to remote recognition.
async function startCaptions() {
  if (!$('#capOn')?.checked) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const lang = $('#lang').value === 'auto' ? navigator.language : $('#lang').value;
  const opts = { langs: [lang], processLocally: true };
  let status = 'unavailable';
  try { if (SR?.available) status = await SR.available(opts); } catch {}
  if (status === 'downloadable' || status === 'downloading') {
    $('#live').innerHTML = '<i>正在下載本機語言包，完成後開始顯示字幕…</i>';
    status = await SR.install(opts).catch(() => false) ? 'available' : 'unavailable';
  }
  if (status !== 'available') return $('#live').innerHTML = '<i>這個瀏覽器無法在本機辨識這個語言，所以不顯示即時字幕（不會改用雲端）。錄音仍會正常轉錄。</i>';
  if (rec?.state !== 'recording') return; // stopped while the language pack downloaded
  $('#live').innerHTML = '<i>本機辨識中…（僅供預覽）</i>';
  let finalText = '';
  recog = new SR();
  recog.processLocally = true;
  recog.lang = lang;
  recog.continuous = true;
  recog.interimResults = true;
  recog.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + '\n';
      else interim += e.results[i][0].transcript;
    }
    $('#live').innerHTML = esc(finalText) + `<i>${esc(interim)}</i>`;
    $('#live').scrollTop = $('#live').scrollHeight;
  };
  // Chrome ends recognition after silence; restart while still recording.
  recog.onend = () => { if (rec?.state === 'recording' && recog) recog.start(); };
  recog.start();
}

// ---- 會議頁 ----
const cites = line => line.replace(/\[(\d+(?:\s*[,，、-]\s*\d+)*)\]/g, (_, ns) => ns.split(/[,，、]/).map(n => n.trim().split('-')[0])
  .map(n => `<a class="cite" href="#seg-${n}" onclick="return seek(${n})">[${n}]</a>`).join(''));

const todo = (m, a, i, html, extra = '') => `<label class="todo ${a?.done ? 'done' : ''}"><input type="checkbox" ${a?.done ? 'checked' : ''} ${a ? '' : 'disabled'}
  onchange="setDone('${m.id}', ${i}, this.checked)"><span>${html}</span>${extra}</label>`;

// Checkbox lines are the action items, in the same order the server parsed them.
function renderSummary(m) {
  let k = 0;
  return esc(m.summary).split('\n').map(line => {
    line = cites(line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
    if (/^#{1,6} /.test(line)) return `<h3>${line.replace(/^#+ /, '')}</h3>`;
    if (/^\s*[-*] \[[ xX]\] /.test(line)) { const i = k++; return todo(m, m.actions[i], i, line.replace(/^\s*[-*] \[[ xX]\] /, '')); }
    if (/^\s*([-*]|\d+\.) /.test(line)) return `<ul><li>${line.replace(/^\s*([-*]|\d+\.) /, '')}</li></ul>`;
    return line ? `<p>${line}</p>` : '';
  }).join('');
}

function seek(n) {
  const s = current?.segments[n - 1];
  if (!s) return false;
  $('#audio').currentTime = s.start;
  if (tab !== 'transcript') { tab = 'transcript'; render(current); }
  document.querySelectorAll('.seg.hl').forEach(el => el.classList.remove('hl'));
  const el = document.getElementById(`seg-${n}`);
  el.classList.add('hl'); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return false;
}

function setTab(t) { tab = t; render(current); }

async function openMeeting(id) {
  clearTimeout(pollTimer);
  const same = current?.id === id;
  if (!same) { tab = 'summary'; showRaw = false; activeSeg = 0; }
  const m = await api(`/api/meetings/${id}`);
  current = m;
  // Polling must not wipe text the user is typing (title, notes, glossary).
  if (!same || !document.activeElement?.matches('main textarea, main input:not([type=checkbox])')) render(m);
  refreshList();
  if (BUSY.includes(m.status)) pollTimer = setTimeout(() => openMeeting(id), 2000);
}

      ${c.seg ? `· <a href="#${m.id}:seg-${c.seg}" onclick="return seek(${c.seg})">逐字稿第 ${c.seg} 段</a>` : ''}</span>
      ${c.userId === me.id || m.perm === 'owner' ? `<button class="ghost" data-keep onclick="delComment('${c.id}')">刪除</button>` : ''}<div>${esc(c.text)}</div></div>`).join('')
      || '<p class="muted">還沒有留言</p>'}
    ${rank(m.perm) >= rank('comment') ? `<textarea id="cmt" data-keep aria-label="留言" placeholder="留言…"></textarea>
      <div class="row"><button data-keep onclick="addComment()">送出留言</button>
      <label class="muted"><input type="checkbox" id="cmtseg" data-keep> 附上目前播放到的逐字稿段落</label></div>` : ''}`);
  // Below edit permission, lock every editing control; viewing, playback and (if allowed) commenting stay usable.
  if (rank(m.perm) < rank('edit')) {
    document.querySelectorAll('main input, main textarea, main select').forEach(el => { if (!el.matches('[data-keep]')) el.disabled = true; });
    document.querySelectorAll('main .tag-x, main .tag-add, .ai-head .ghost, .ai-foot button, .speakers select').forEach(el => { el.hidden = true; });
  }
  const audio = keepAudio || Object.assign(document.createElement('audio'), { id: 'audio', controls: true, preload: 'metadata', src: `/api/meetings/${m.id}/audio` });
  if (!keepAudio) {
    audio.defaultPlaybackRate = audio.playbackRate = rate; // defaultPlaybackRate survives the media load reset
    audio.addEventListener('timeupdate', syncTranscript);
  }
  audio.dataset.id = m.id;
  $('#audioSlot').append(audio);
  syncTranscript();
}

function setRate(r) {
  rate = r;
  localStorage.setItem('rate', r);
  Object.assign($('#audio'), { defaultPlaybackRate: r, playbackRate: r });
  document.querySelectorAll('.player .rate').forEach(b => { b.classList.toggle('on', +b.dataset.r === r); b.setAttribute('aria-pressed', +b.dataset.r === r); });
}

function skip(sec) {
  const a = $('#audio');
  a.currentTime = Math.max(0, Math.min(a.duration || Infinity, a.currentTime + sec));
}

// Highlight the segment being played; scroll it into view only when playback moves to a new one.
function syncTranscript() {
  const a = $('#audio'), segs = current?.segments ?? [];
  if (!a || (a.paused && !a.currentTime)) return;
  let i = 0;
  while (i < segs.length && segs[i].start <= a.currentTime) i++;
  const el = i ? document.getElementById(`seg-${i}`) : null, prev = document.querySelector('.seg.active');
  if (el === prev) return;
  prev?.classList.remove('active');
  el?.classList.add('active');
  if (el && i !== activeSeg) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  activeSeg = i;
}

async function addComment() {
  const text = $('#cmt').value.trim();
  if (!text) return;
  current = await api(`/api/meetings/${current.id}/comments`, json('POST', { text, seg: $('#cmtseg').checked && activeSeg ? activeSeg : null }));
  render(current);
}

async function delComment(cid) {
  current = await api(`/api/meetings/${current.id}/comments?id=${encodeURIComponent(cid)}`, { method: 'DELETE' });
  render(current);
}

async function openShares() {
  const shares = await api(`/api/meetings/${current.id}/shares`);
  const link = s => `${location.origin}/#share/${s.token}`;
  $('#sharePanel').innerHTML = `<div class="share-row">建立連結：${['view', 'comment', 'edit'].map(p => `<button data-keep onclick="createShare('${p}')">${PERMS[p]}</button>`).join('')}
    <span class="muted">對方需登入，開啟後取得該權限</span></div>`
    + shares.map(s => `<div class="share-row">${tag([PERMS[s.perm], 'blue'])}<input readonly data-keep value="${esc(link(s))}" onclick="this.select()" aria-label="分享連結">
      <span class="muted">使用 ${s.uses ?? 0} 次</span>${s.revokedAt ? tag(['已撤銷', 'gray']) : `<button data-keep onclick="revokeShare('${s.token}')">撤銷</button>`}</div>`).join('');
}

async function createShare(perm) {
  const s = await api(`/api/meetings/${current.id}/shares`, json('POST', { perm }));
  await navigator.clipboard?.writeText(`${location.origin}/#share/${s.token}`).catch(() => {});
  openShares();
}

async function patch(body) {
  current = await api(`/api/meetings/${current.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  refreshList();
}

async function setTags(tags) {
  await patch({ tags });
  render(current);
}

async function loadTeamTerms() { teamTerms = (await api('/api/learned')).terms.filter(t => t.enabled !== false).map(t => t.term); }

// Speaker-name suggestions from name cues (learning loop P2); nothing changes until the user applies one.
function hintsHtml(m, canEdit) {
  const open = (m.speakerHints ?? []).filter(h => m.segments.some(s => s.speaker === h.speaker) && m.speakers?.[h.speaker] !== h.name);
  if (!open.length) return '';
  return `<div class="hints"><span class="muted">💡 講者建議：</span>${open.map(h => `<span class="tag yellow" title="${esc(h.reason)}">${esc(`Speaker ${h.speaker < 26 ? String.fromCharCode(65 + h.speaker) : h.speaker + 1}`)} = ${esc(h.name)}
    ${h.evidence.map(n => `<a href="#${m.id}:seg-${n}" onclick="return seek(${n})">[${n}]</a>`).join('')}</span>
    ${canEdit ? `<button class="ghost" onclick="renameSpeaker(${h.speaker}, ${esc(JSON.stringify(h.name))})">套用</button>` : ''}`).join('')}</div>`;
}

async function addTeamTerm(input) {
  try {
    const { terms } = await api('/api/learned/terms', json('POST', { term: input.value }));
    input.value = '';
    $('#term-msg').textContent = `已加入：${terms.join('、')}`;
    loadTeamTerms();
  } catch (e) { $('#term-msg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

async function setBenchmark(on) {
  try { current = await api(`/api/meetings/${current.id}/benchmark`, json(on ? 'POST' : 'DELETE', {})); render(current); }
  catch (e) { alert(e.message); }
}

async function renameSpeaker(s, name) {
  await patch({ speakers: { ...current.speakers, [s]: name.trim() || undefined } });
  render(current);
}

async function setParticipants(names) {
  await patch({ participants: names });
  render(current);
}

// Reassign a range of segments (click a name; Shift-click another name or type the end to widen it) to an existing speaker,
// a participant who hasn't spoken yet, or someone new.
function pickSpeaker(i, ev) {
  pick = pick && ev?.shiftKey ? { ...pick, to: i } : { from: i, to: i };
  showPick();
}
function showPick() {
  document.querySelector('.range-pick')?.remove();
  const m = current, n = m.segments.length, lo = Math.min(pick.from, pick.to), hi = Math.max(pick.from, pick.to);
  document.querySelectorAll('.seg').forEach((el, k) => el.classList.toggle('in-range', k >= lo && k <= hi));
  const ids = [...new Set(m.segments.map(s => s.speaker))].sort((a, b) => a - b), spoken = ids.map(x => spk(m, x));
  const fresh = uniq([...m.participants, ...directory.people.map(p => p.name)]).filter(x => !spoken.includes(x));
  const box = Object.assign(document.createElement('div'), { className: 'range-pick', innerHTML: `改成
    <select aria-label="改成哪位講者"><option value="">選擇講者…</option>${ids.map(x => `<option value="${x}">${esc(spk(m, x))}</option>`).join('')}
      ${fresh.map(x => `<option value="n:${esc(x)}">${esc(x)}（新講者）</option>`).join('')}<option value="new">＋ 其他人…</option></select>
    第 <input type="number" aria-label="從第幾段" min="1" max="${n}" value="${lo + 1}"> 到 <input type="number" aria-label="到第幾段" min="1" max="${n}" value="${hi + 1}"> 段
    <button class="primary">套用</button><button class="ghost">取消</button><span class="muted">Shift＋點另一段的名字可以選範圍</span>` });
  const [from, to] = box.querySelectorAll('input'), [ok, cancel] = box.querySelectorAll('button');
  const clamp = v => Math.max(0, Math.min(n - 1, (+v || 1) - 1));
  from.onchange = to.onchange = () => { pick = { from: clamp(from.value), to: clamp(to.value) }; showPick(); };
  cancel.onclick = () => { pick = null; render(current); };
  ok.onclick = async () => {
    let target = box.querySelector('select').value, speakers;
    if (!target) return box.querySelector('select').focus();
    if (target === 'new' || target.startsWith('n:')) {
      const name = target === 'new' ? prompt('講者姓名') : target.slice(2);
      if (!name?.trim()) return;
      target = Math.max(...ids) + 1;
      speakers = { ...m.speakers, [target]: canon(name, directory.people.map(p => p.name)) };
    }
    await patch({ segSpeakers: Object.fromEntries(Array.from({ length: hi - lo + 1 }, (_, k) => [lo + k, +target])), ...(speakers && { speakers }) });
    pick = null;
    render(current);
  };
  document.getElementById(`seg-${hi + 1}`).after(box);
  box.querySelector('select').focus();
}

async function mergeSpeaker(from, to) {
  if (!Number.isInteger(to)) return;
  await patch({ segSpeakers: Object.fromEntries(current.segments.map((s, i) => [i, s.speaker]).filter(([, s]) => s === from).map(([i]) => [i, to])) });
  render(current);
}

async function resummarize(retranscribe = false) {
  try {
    await api(`/api/meetings/${current.id}/summarize`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ template: $('#tpl')?.value ?? current.template, outputLang: $('#outLang')?.value ?? current.outputLang, agentId: current.agentId,
        instructions: $('#instr')?.value ?? current.instructions, retranscribe }),
    });
  } catch (e) { alert(e.message); }
  openMeeting(current.id);
}

// ---- 搜尋 ----
async function showSearch(q) {
  stop();
  await refreshList();
  searchQ = q;
  page(`<div class="icon">🔍</div><h1>搜尋</h1>
    <input id="q" class="search" aria-label="搜尋" value="${esc(q)}" placeholder="搜尋標題、標籤、摘要、筆記、待辦、逐字稿…" oninput="onSearch(this.value)">
    <p class="muted">多個關鍵字要全部符合；簡體、繁體都找得到。篩選：<code>tag:平台</code> <code>who:小美</code> <code>team:SPC</code> <code>leader:Ken</code> <code>group:ZTSA</code> <code>type:站立</code>
      <code>after:2026-10-01</code> <code>before:2026-10-31</code> <code>"完整片語"</code></p>
    <div>${allTags().map((t, i) => `<button class="tag ${tagColor(t)}" onclick="addFilter(${i})">${esc(t)}</button>`).join('')}</div>
    <div id="results"></div>`);
  $('#q').focus();
  $('#q').setSelectionRange(q.length, q.length);
  runSearch(q);
}

function addFilter(i) {
  const t = allTags()[i];
  $('#q').value = `${searchQ} ${/\s/.test(t) ? `tag:"${t}"` : `tag:${t}`}`.trim();
  onSearch($('#q').value);
}

function onSearch(q) {
  searchQ = q;
  history.replaceState(null, '', `#search=${encodeURIComponent(q)}`); // keep the query in the URL without re-routing
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(q), 200);
}

async function runSearch(q) {
  const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
  if (q !== searchQ || !$('#results')) return; // a newer query or another page took over
  const re = r.terms.length && new RegExp(r.terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  const hl = s => re ? esc(s).replace(re, '<mark>$&</mark>') : esc(s);
  const link = (id, h) => `#${id}${h.seg ? `:seg-${h.seg}` : h.field === 'notes' ? ':notes' : ''}`;
  $('#results').innerHTML = `<p class="muted">${r.results.length} 場會議</p>` + r.results.map(m => `<div class="result">
    <a class="r-title" href="#${m.id}">📄 ${hl(m.title)}</a> <span class="muted">${esc(whenLabel(m))}</span> ${tag(TYPES[m.template] ?? TYPES.auto)}${m.tags.map(tagLink).join('')}${m.teams.map(teamLink).join('')}
    ${m.hits.filter(h => h.field !== 'title').map(h => `<a class="hit" href="${link(m.id, h)}"><span class="hit-label">${h.label}${h.seg ? ` · ${fmt(h.at)} ${esc(h.speaker)}` : ''}</span>${hl(h.snippet)}</a>`).join('')}
    ${m.transcriptHits > 5 ? `<p class="muted">逐字稿另有 ${m.transcriptHits - 5} 處符合</p>` : ''}</div>`).join('');
}

async function route() {
  if (!me) return showLogin();
  const h = location.hash.slice(1);
  if (h.startsWith('share/')) { // opening a share link grants its permission, then shows the meeting
    try { location.hash = (await api(`/api/shares/${encodeURIComponent(h.slice(6))}`, json('POST', {}))).id; }
    catch (e) { page(`<p class="err">${esc(e.message)}</p>`); }
    return;
  }
  const [id, sub] = h.split(':');
  $('#main').scrollTop = 0;
  const r = h.startsWith('search') ? 'search' : ['new', 'actions', 'people', 'me', 'admin'].includes(h) ? h : h ? '' : 'db';
  document.querySelectorAll('aside [data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  const go = r === 'search' ? showSearch(decodeURIComponent(h.slice('search='.length)))
    : h === 'new' ? showNew() : h === 'actions' ? showActions() : h === 'people' ? showPeople() : h === 'me' ? showMe() : h === 'admin' ? showAdmin()
    : /^[0-9a-f-]{36}$/.test(id) ? openMeeting(id).then(() => sub?.startsWith('seg-') ? seek(+sub.slice(4)) : sub === 'notes' && setTab('notes'))
    : !h ? showDb() : null;
  Promise.resolve(go).catch(e => page(`<p class="err">${esc(e.message)}</p>`));
}
window.addEventListener('hashchange', route);
// ---- 側欄：拖曳調整寬度、收合（⌘\），狀態存在 localStorage ----
function setSideWidth(w) {
  w = Math.round(Math.max(180, Math.min(480, w)));
  document.documentElement.style.setProperty('--side-w', `${w}px`);
  localStorage.setItem('sideW', w);
}
function toggleSide(collapse = !document.body.classList.contains('side-collapsed')) {
  document.body.classList.toggle('side-collapsed', collapse);
  localStorage.setItem('sideCollapsed', collapse ? '1' : '');
}
setSideWidth(+localStorage.getItem('sideW') || 240);
toggleSide(localStorage.getItem('sideCollapsed') === '1');
$('#resizer').addEventListener('pointerdown', e => {
  e.preventDefault();
  document.body.classList.add('resizing');
  const move = ev => setSideWidth(ev.clientX);
  const up = () => { document.body.classList.remove('resizing'); removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
});
$('#resizer').addEventListener('dblclick', () => setSideWidth(240));

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); toggleSide(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (location.hash.startsWith('#search')) $('#q')?.focus(); else location.hash = 'search';
  }
});
boot();
</script>
